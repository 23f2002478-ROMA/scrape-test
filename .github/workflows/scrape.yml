## Step 5: Watch It Run

1. Go to your repository → click the **"Actions"** tab
2. You should see a workflow run already in progress (because you just pushed files)
3. Click on it → click on the **"scrape"** job → expand the **"Run scraper"** step
4. You'll see the sums printed for each URL and the grand total at the bottom

If it's not running, click **"Run workflow"** → **"Run workflow"** (green button) to trigger it manually.

