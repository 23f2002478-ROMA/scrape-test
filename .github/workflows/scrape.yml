## Step 6: Create a GitHub Personal Access Token (PAT)

The assignment asks for your repo URL + a token so they can verify your logs.

1. Click your **profile picture** (top right on GitHub) → **Settings**
2. Scroll all the way down the left sidebar → click **"Developer settings"**
3. Click **"Personal access tokens"** → **"Tokens (classic)"**
4. Click **"Generate new token"** → **"Generate new token (classic)"**
5. Give it a name like `assignment-token`
6. Set expiration to **30 days** (enough for grading)
7. Under **"Select scopes"**, check:
   - `repo` (full control of repositories)
   - `workflow` (to read action logs)
8. Scroll down → click **"Generate token"**
9. **Copy the token immediately** — you can't see it again after you leave the page!

